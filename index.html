.top h1{font-size:20px;flex:1;color:var(--g);font-weight:800}
.chip{font-weight:800;font-family:'Baloo 2';display:flex;gap:4px;align-items:center}
.bar{height:16px;background:var(--line);border-radius:99px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--g);border-radius:99px;transition:width .4s}
.btn{display:block;width:100%;border:0;border-bottom:4px solid var(--gd);background:var(--g);color:#fff;font:800 16px 'Baloo 2';padding:12px 18px;border-radius:16px;cursor:pointer;letter-spacing:.3px}
.btn:active{transform:translateY(3px);border-bottom-width:1px}.btn.b{background:var(--b);border-color:var(--bd)}.btn.w{background:var(--card);color:var(--b);border:2px solid var(--line);border-bottom-width:4px}
.btn.s{width:auto;display:inline-block;padding:6px 14px;font-size:14px}
.btn:disabled{background:var(--line);border-color:var(--line);color:var(--mute);cursor:not-allowed}
.hero{background:var(--g);color:#fff;border-radius:20px;padding:16px 18px;margin:16px 0 8px;border-bottom:4px solid var(--gd)}
.hero h2{font-size:22px}.hero p{margin:2px 0 0;opacity:.95;font-size:14px}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 0}

.card{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:14px;margin:10px 0}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1;padding:8px 4px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--mute);border-radius:12px;font:700 14px 'Baloo 2','Noto Sans Devanagari';cursor:pointer}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}

pre{white-space:pre-wrap;font:14px/1.7 'Noto Sans Devanagari';background:var(--soft);padding:12px;border-radius:12px;margin:8px 0;border:2px dashed var(--line)}

.opt.ok{border-color:var(--g);background:rgba(88,204,2,.14)}.opt.no{border-color:var(--r);background:rgba(255,75,75,.12)}
.fb{padding:12px 14px;border-radius:14px;margin:10px 0;font-weight:600}.fb.ok{background:rgba(88,204,2,.15);color:var(--gd)}.fb.no{background:rgba(255,75,75,.15);color:var(--rd)}
.back{background:none;border:0;font:800 22px 'Baloo 2';color:var(--mute);cursor:pointer;padding:0 6px}
.tag{display:inline-block;font:700 12px 'Baloo 2';padding:1px 10px;border-radius:99px;background:var(--b);color:#fff}
.dec{border-left:6px solid var(--o);border-radius:6px 14px 14px 6px}
button:focus-visible{outline:3px solid var(--b);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
input,textarea,select{width:100%;font:inherit;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin:4px 0 10px}
label{font-weight:700;font-size:14px}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#333;color:#fff;padding:10px 16px;border-radius:12px;z-index:9;font-weight:700}
.node:disabled{background:var(--line)!important;border-color:var(--mute)!important;cursor:not-allowed}.opt.sel{border-color:var(--b);background:rgba(28,176,246,.12)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row .btn{margin:0}.card table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}.card td,.card th{border:1px solid var(--line);padding:6px 8px}.card img{max-width:100%;height:auto}

/* ---- login page ---- */
.lg{padding:14px 0 30px}
.lg-hero{position:relative;overflow:hidden;text-align:center;color:#fff;border-radius:28px;padding:34px 18px 48px;background:linear-gradient(150deg,#58cc02 0%,#2db84d 55%,#1cb0f6 130%);border-bottom:5px solid var(--gd)}
.lg-hero h1{font-size:36px;font-weight:800;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.15);position:relative}
.lg-hero p{margin:6px auto 0;max-width:300px;font-size:14px;opacity:.95;position:relative}
.lg-logo{display:block;width:84px;height:84px;margin:0 auto 10px;border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.18);background:#fff;font-size:46px;line-height:84px;position:relative;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}

.lg-card h2{font-size:21px;margin-bottom:6px;text-align:center}
.fld{position:relative}.fld input{padding-left:42px;margin:6px 0 12px}

.fld .eye{position:absolute;right:4px;top:56px;transform:translateY(-50%);background:none;border:0;font-size:18px;padding:8px;cursor:pointer}
.lg-note{text-align:center;color:var(--mute);font-size:13px;margin:12px 0 2px}
.lg-f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 12px}
.lg-f div{background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:10px;font-weight:700;font-size:13px;text-align:center}
.lg-req summary{cursor:pointer;list-style:none;text-align:center;font-weight:700;padding:12px;border:2px dashed var(--line);border-radius:16px;color:var(--b)}
.lg-req summary::-webkit-details-marker{display:none}
.lg-reqbox{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin-top:8px}.lg-reqbox p{margin:0 0 8px;color:var(--mute);font-size:14px}
@media(prefers-reduced-motion:reduce){.lg *{animation:none!important}}

<script type="module">
// ===== 1. CONFIG: paste your Firebase web-app config here (Project settings > Your apps) =====
const CFG={apiKey:"AIzaSyBaYVdWP3Q9D1BuCfbVelgYeAgoF5Ofj8Q",authDomain:"ank-maths.firebaseapp.com",projectId:"ank-maths",appId:"1:898672404386:web:3544b9ca8cb120f38bb4fb"};
const CFGAPP={xpLesson:20,xpPerCorrect:5,mixCount:20,adminWhatsApp:'917545831820'}; // adminWhatsApp: देश कोड सहित, बिना + के, जैसे 919876543210
import {initializeApp,deleteApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,collection,doc,getDoc,getDocs,setDoc,addDoc,deleteDoc,query,where,orderBy,limit,serverTimestamp,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
if(CFG.apiKey.startsWith('YOUR_'))setTimeout(()=>alert('index.html में CFG (Firebase config) अभी भरा नहीं है'),500);
const app=initializeApp(CFG),auth=getAuth(app),db=initializeFirestore(app,{localCache:persistentLocalCache()}); // cache = offline reading of loaded content

// ===== 2. STATE & HELPERS =====
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),nl=s=>esc(s).replace(/\n/g,'<br>');
const toast=m=>{const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),2600)};
const empty=m=>`<div class="card" style="text-align:center;color:var(--mute)">${m}</div>`;

// Lessons/questions may contain simple HTML. It is cleaned first (scripts, iframes, on* handlers, javascript: links are removed).
const HTMLTAG=/<\/?(p|div|span|b|i|u|em|strong|br|ul|ol|li|table|tr|td|th|thead|tbody|h[1-6]|img|a|sup|sub|hr|center|font|code|pre|blockquote)\b[^>]*>/i;
function clean(h){const d=new DOMParser().parseFromString(h,'text/html');d.querySelectorAll('script,iframe,object,embed,link,meta,style,form,base').forEach(e=>e.remove());
 d.body.querySelectorAll('*').forEach(e=>[...e.attributes].forEach(a=>{const n=a.name.toLowerCase(),x=a.value.trim().toLowerCase();if(n.startsWith('on')||((n=='href'||n=='src')&&/^(javascript|vbscript|data:text)/.test(x)))e.removeAttribute(a.name)}));return d.body.innerHTML}
const rich=s=>HTMLTAG.test(s||'')?clean(s):nl(s);
// Bulk import helpers: CSV (Excel "CSV UTF-8") or JSON
function parseCSV(s){const r=[];let row=[],f='',q=false;for(let i=0;i<s.length;i++){const c=s[i];
 if(q){if(c=='"'){if(s[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'){row.push(f);r.push(row);row=[];f=''}else if(c!='\r')f+=c}
 row.push(f);r.push(row);return r.filter(x=>x.some(y=>y.trim()))}
function parseIn(s){s=s.trim().replace(/^\uFEFF/,'');if(s[0]=='['||s[0]=='{'){const j=JSON.parse(s);return Array.isArray(j)?j:[j]}
 const [h,...b]=parseCSV(s);return b.map(r=>Object.fromEntries(h.map((k,i)=>[k.trim(),(r[i]||'').trim()])))}
const dl=(name,text,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()};
const checkQ=d=>{if(!['mcq','num','multi'].includes(d.type))return 'type: mcq / num / multi में से एक';
 if(d.type=='num')return isNaN(parseFloat(d.answer))?'संख्यात्मक उत्तर चाहिए':'';
 if(!/^[1-4](,[1-4])*$/.test(d.answer)||(d.type=='mcq'&&d.answer.length>1))return 'उत्तर 1-4 में दें (multi: 1,3)';return d.o1&&d.o2?'':'कम से कम 2 विकल्प चाहिए'};
const SAMPLE={subjects:{title:'अंकगणित',emoji:'🧮',order:1,published:'true'},chapters:{subject:'अंकगणित',title:'जोड़',emoji:'➕',order:1,published:'true'},
 lessons:{chapter:'जोड़',title:'जोड़ की विधि',intro:'<b>परिचय</b> यहाँ लिखें',theory:'दाएँ से जोड़ें',formulas:'$a+b=b+a$',example:'478+259=737',steps:'',shortcut:'',mistakes:'',mins:5,order:1,published:'true'},
 questions:{chapter:'जोड़',lesson:'जोड़ की विधि',type:'mcq',text:'478 + 259 = ?',o1:'727',o2:'737',o3:'747',o4:'637',answer:2,tol:0,marks:1,neg:0,explanation:'478+259=737',order:1,published:'true'}};
let U=null,ADM=false,P={xp:0,streak:1,done:{}},C={subjects:[],chapters:[],lessons:[],questions:[],users:[]},v={tab:'learn',sub:null,ch:null,les:null,quiz:null,ed:null,ad:'subjects',att:null,busy:false,db:null,dn:20,dopen:false};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const byOrder=a=>a.sort((x,y)=>(x.order||0)-(y.order||0));
const rows=s=>s.docs.map(d=>({id:d.id,...d.data()}));

// ===== 3. FIREBASE OPERATIONS (content + progress) =====
async function load(){ // learners only receive published docs (enforced by rules too)
 const names=ADM?['subjects','chapters','lessons','questions']:['subjects','chapters','lessons'];let ver=0;
 if(!ADM){try{const m=await getDoc(doc(db,'meta','content'));ver=m.exists()?m.data().v:0}catch(e){}
  if(ver){try{const c=JSON.parse(localStorage.getItem('ank_c')||'null');if(c&&c.v==ver){names.forEach(n=>C[n]=c[n]);return}}catch(e){}}} // unchanged content: no re-download
 const r=await Promise.all(names.map(n=>getDocs(ADM?collection(db,n):query(collection(db,n),where('published','==',true)))));
 names.forEach((n,i)=>C[n]=byOrder(rows(r[i])));
 if(!ADM&&ver){try{localStorage.setItem('ank_c',JSON.stringify({v:ver,subjects:C.subjects,chapters:C.chapters,lessons:C.lessons}))}catch(e){}}
}
const bump=()=>setDoc(doc(db,'meta','content'),{v:Date.now()}).catch(()=>{}); // admin: tells learners "content changed"
const reload=async()=>{await bump();await load()};
const save=async p=>{try{await setDoc(doc(db,'users',U.uid),{...p,updated:serverTimestamp()},{merge:true})}catch(e){toast('सहेजा नहीं जा सका — नेटवर्क जाँचें')}};
function daily(){const t=new Date().toLocaleDateString('en-CA'),y=new Date(Date.now()-864e5).toLocaleDateString('en-CA');
 if(P.lastDay!=t){P.streak=P.lastDay==y?(P.streak||0)+1:1;P.lastDay=t;save({streak:P.streak,lastDay:t})}}

// ===== 4. QUIZ ENGINE (reusable: reads questions only from Firebase) =====
const optsOf=q=>[q.o1,q.o2,q.o3,q.o4].filter(Boolean);
const correctIdx=q=>q.type=='multi'?String(q.answer).split(',').map(n=>n-1):[Number(q.answer)-1];
function judge(q,a){
 if(q.type=='num'){const n=parseFloat(a);return !isNaN(n)&&Math.abs(n-parseFloat(q.answer))<=(+q.tol||0)}
 if(q.type=='multi')return JSON.stringify([...a].sort())==JSON.stringify(correctIdx(q).sort());
 return a===correctIdx(q)[0]}
async function startQuiz(o,only){ // o={chId, lessonId?, mix?}  lesson quiz = that lesson's questions; mix = whole chapter, shuffled
 try{let qs=only;if(!qs){const f=o.lessonId?where('lessonId','==',o.lessonId):where('chapterId','==',o.chId);
   qs=byOrder(rows(await getDocs(query(collection(db,'questions'),f,where('published','==',true)))));if(o.mix)qs=shuffle(qs).slice(0,CFGAPP.mixCount)}
  if(!qs.length)return toast(o.lessonId?'इस पाठ का क्विज़ जल्द आएगा':'इस अध्याय में अभी प्रश्न नहीं हैं');
  v.quiz={...o,retry:!!only,qs,i:0,sel:qs[0].type=='multi'?[]:null,checked:false,res:[],t0:Date.now(),end:false};render()}catch(e){toast('प्रश्न लोड नहीं हुए')}}
async function finishQuiz(q){
 if(q.saved)return;q.saved=true;q.end=true; // guard against duplicate submission
 const correct=q.res.filter(r=>r.ok).length,secs=Math.round((Date.now()-q.t0)/1000);
 P.xp+=correct*CFGAPP.xpPerCorrect;
 try{await addDoc(collection(db,'users',U.uid,'attempts'),{chapterId:q.chId,lessonId:q.lessonId||'',mix:!!q.mix,score:q.res.reduce((a,r)=>a+r.m,0),total:q.qs.reduce((a,x)=>a+(+x.marks||1),0),correct,n:q.qs.length,wrong:q.res.filter(r=>!r.ok).map(r=>r.id),secs,at:serverTimestamp()});
  await save({xp:P.xp});v.att=null;
  const pct=Math.round(correct/q.qs.length*100); // best score of a lesson quiz is shown on the lesson page
  if(q.lessonId&&!q.retry&&pct>((P.qbest||{})[q.lessonId]??-1)){P.qbest={...P.qbest,[q.lessonId]:pct};await save({qbest:{[q.lessonId]:pct}})}}catch(e){toast('परिणाम सहेजा नहीं जा सका')}
 render()}

// ===== 5. VIEWS =====
const nav=()=>`<nav class="nav"><div>${[['learn','🏠','सीखें'],['practice','🎯','अभ्यास'],['doubts','💬','संदेह'],['progress','📊','प्रगति'],...(ADM?[['admin','⚙️','एडमिन']]:[])].map(t=>`<button class="${v.tab==t[0]?'on':''}" onclick="A.tab('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('')}</div></nav>`;
const SYMS=[['+',8,16,34],['−',82,10,30],['×',14,68,36],['÷',84,62,32],['%',46,6,28],['π',70,40,30],['√',24,38,30],['∑',56,74,34]];
const loginView=()=>`<div class="lg">
 <div class="lg-hero">${SYMS.map((s,i)=>`<i class="sym" style="left:${s[1]}%;top:${s[2]}%;font-size:${s[3]}px;animation-delay:${i*.7}s">${s[0]}</i>`).join('')}
  <img class="lg-logo" src="icons/icon-192.png" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'lg-logo',textContent:'🧮'}))">

 <div class="lg-card"><h2>वापसी पर स्वागत है 👋</h2><div id="inst"></div>

function learn(){
 if(v.les){const l=C.lessons.find(x=>x.id==v.les),sec=(t,x)=>x?`<div class="card"><b class="f">${t}</b><div>${rich(x)}</div></div>`:'';
  if(l.soon)return `<button class="back" onclick="A.les(null)">←</button><h2>${esc(l.title)}</h2><div class="card" style="text-align:center;padding:30px"><div style="font-size:48px">🚧</div><b class="f">यह पाठ जल्द आ रहा है…</b></div>`;
  return `<button class="back" onclick="A.les(null)">←</button><h2>${esc(l.title)}</h2>`+sec('परिचय',l.intro)+sec('सिद्धांत',l.theory)+sec('📐 सूत्र',l.formulas)+sec('✏️ हल उदाहरण',l.example)+sec('चरणबद्ध हल',l.steps)+sec('⚡ शॉर्टकट',l.shortcut)+sec('⚠️ आम गलतियाँ',l.mistakes)+`<button class="btn b" style="margin-top:10px" onclick="A.lq('${l.id}')">📝 पाठ क्विज़${P.qbest&&P.qbest[l.id]!=null?' (सर्वश्रेष्ठ '+P.qbest[l.id]+'%)':''}</button>`+(P.done[l.id]?'<div class="fb ok">✅ पाठ पूर्ण</div>':`<button class="btn" onclick="A.finish('${l.id}')">पाठ पूर्ण करें +${CFGAPP.xpLesson} XP</button>`)}
 if(v.ch){const c=C.chapters.find(x=>x.id==v.ch),ls=C.lessons.filter(x=>x.chapterId==c.id);
  return `<button class="back" onclick="A.ch(null)">←</button><h2>${c.emoji||''} ${esc(c.title)}</h2><div class="path">`+ls.map((l,i)=>{const d=P.done[l.id],open=l.soon||ls.slice(0,i).every(x=>x.soon||P.done[x.id]);
   return `<button class="node" style="${l.soon?'background:var(--mute);border-color:var(--line)':d?'background:var(--o);border-color:var(--od)':'background:var(--b);border-color:var(--bd)'}" ${open?'':'disabled'} onclick="A.les('${l.id}')" aria-label="${esc(l.title)}">${l.soon?'🚧':d?'⭐':open?'📖':'🔒'}</button><div class="lbl">${esc(l.title)}<small>${l.soon?'जल्द आ रहा है':(l.mins||5)+' मिनट'}</small></div>`}).join('')+'</div>'+(ls.length?'':empty('इस अध्याय में अभी पाठ नहीं हैं'))}
 let h='';const last=C.lessons.find(l=>l.id==P.last&&!P.done[l.id]&&!l.soon);
 if(last)h+=`<button class="btn b" style="margin-top:14px" onclick="A.les('${last.id}')">▶ जारी रखें: ${esc(last.title)}</button>`;
 C.subjects.forEach(s=>{const cs=C.chapters.filter(c=>c.subjectId==s.id);if(!cs.length)return;
  h+=`<details ${v.os==s.id?'open':''} ontoggle="if(this.open)v.os='${s.id}'"><summary class="hero" style="cursor:pointer;list-style:none;margin-top:10px"><h2 style="margin:0">${s.emoji||''} ${esc(s.title)}</h2><small>${cs.length} अध्याय</small></summary>`;
  cs.forEach(c=>{const ls=C.lessons.filter(l=>l.chapterId==c.id&&!l.soon),n=ls.filter(l=>P.done[l.id]).length,p=ls.length?Math.round(n/ls.length*100):0;
   h+=`<div class="card" style="cursor:pointer" onclick="A.ch('${c.id}')"><b class="f" style="font-size:17px">${c.emoji||''} ${esc(c.title)}</b><div style="color:var(--mute);font-size:13px">${ls.length?n+'/'+ls.length+' पाठ · '+p+'%':'🚧 जल्द आ रहा है'}</div>${ls.length?`<div class="bar" style="margin-top:6px"><i style="width:${p}%"></i></div>`:''}</div>`});h+='</details>'});

function practice(){
 const q=v.quiz;
 if(!q){let h='<h2 style="margin:16px 0 4px">🔀 मिक्स रिवीज़न क्विज़</h2><p style="color:var(--mute);margin:0 0 8px">अध्याय के सभी पाठों के प्रश्न मिलाकर (अधिकतम '+CFGAPP.mixCount+') · कैलकुलेटर के बिना हल करें। पाठ का अपना क्विज़ पाठ के अंदर मिलेगा।</p>';
  C.subjects.forEach(s=>{const cs=C.chapters.filter(c=>c.subjectId==s.id);if(!cs.length)return;
   h+=`<details ${v.ps==s.id?'open':''} ontoggle="if(this.open)v.ps='${s.id}'"><summary class="hero" style="cursor:pointer;list-style:none;margin-top:10px"><h2 style="margin:0">${s.emoji||''} ${esc(s.title)}</h2></summary>`+cs.map(c=>`<div class="card row"><b class="f" style="flex:1">${c.emoji||''} ${esc(c.title)}</b><button class="btn s b" onclick="A.start('${c.id}')">🔀 मिक्स</button></div>`).join('')+'</details>'});
  return h==''?empty('अभी कोई अध्याय नहीं है'):h}
 if(q.end){const co=q.res.filter(r=>r.ok).length,sc=q.res.reduce((a,r)=>a+r.m,0),wrong=q.qs.filter(x=>q.res.find(r=>r.id==x.id&&!r.ok));
  return `<div style="text-align:center;padding:24px 0"><div style="font-size:64px">${co==q.qs.length?'🏆':'🎯'}</div><h2>स्कोर ${sc}</h2><p>सही ${co}/${q.qs.length} · शुद्धता ${Math.round(co/q.qs.length*100)}% · ${Math.round((Date.now()-q.t0)/1000)} सेकंड</p></div>`+wrong.map(x=>`<div class="card"><div>${rich(x.text)}</div><div class="fb ok" style="margin-top:8px">उत्तर: ${x.type=='num'?esc(x.answer):correctIdx(x).map(i=>esc(optsOf(x)[i])).join(', ')}<br>${rich(x.explanation)}</div></div>`).join('')+(wrong.length?`<button class="btn b" onclick="A.retry()">गलत प्रश्न फिर हल करें</button>`:'')+`<button class="btn w" style="margin-top:8px" onclick="A.back()">वापस</button>`}
 const x=q.qs[q.i];let h=`<div class="row" style="margin:16px 0"><div class="bar"><i style="width:${q.i/q.qs.length*100}%"></i></div><span class="chip">${q.i+1}/${q.qs.length}</span></div><h2 style="font-size:21px;margin-bottom:10px">${rich(x.text)}</h2>`;
 if(x.type=='num')h+=`<input id="ans" inputmode="decimal" placeholder="उत्तर लिखें" ${q.checked?'disabled':''} value="${esc(q.sel||'')}">`;
 else{const ok=correctIdx(x);optsOf(x).forEach((o,i)=>{const on=x.type=='multi'?q.sel.includes(i):q.sel===i;let c=on?'sel':'';if(q.checked){if(ok.includes(i))c='ok';else if(on)c='no'}
  h+=`<button class="opt ${c}" ${q.checked?'disabled':''} onclick="A.pick(${i})">${x.type=='multi'?(on?'☑ ':'☐ '):''}${esc(o)}</button>`})}
 if(!q.checked)return h+`<button class="btn" style="margin-top:10px" onclick="A.check()">जाँचें</button>`;
 const r=q.res[q.res.length-1];
 return h+`<div class="fb ${r.ok?'ok':'no'}">${r.ok?'✅ सही!':'❌ गलत।'} ${x.type=='num'&&!r.ok?'उत्तर: '+esc(x.answer)+'<br>':''}${rich(x.explanation)}</div><button class="btn" onclick="A.next()">${q.i==q.qs.length-1?'परिणाम देखें':'आगे बढ़ें'}</button>`}

 `<h3 style="margin:14px 0 4px">हाल के प्रयास</h3>`+at.slice(0,8).map(x=>{const c=C.chapters.find(y=>y.id==x.chapterId);return `<div class="card">${esc(c?c.title:'')}${x.mix?' · 🔀 मिक्स':x.lessonId?' · 📝 पाठ क्विज़':''} — ${x.correct}/${x.n} · ${x.at?x.at.toDate().toLocaleDateString():''}</div>`}).join('')+
 `<button class="btn w" style="margin-top:14px" onclick="A.logout()">लॉग आउट</button>`}

const SC={
 subjects:[['title','नाम'],['emoji','Emoji'],['order','क्रम','n'],['published','प्रकाशित','b']],
 chapters:[['subjectId','विषय','sel:subjects'],['title','नाम'],['emoji','Emoji'],['order','क्रम','n'],['published','प्रकाशित','b']],
 lessons:[['chapterId','अध्याय','sel:chapters'],['title','शीर्षक'],['intro','परिचय','a'],['theory','सिद्धांत','a'],['formulas','सूत्र (गणित $...$ में)','a'],['example','हल उदाहरण','a'],['steps','चरणबद्ध हल','a'],['shortcut','शॉर्टकट','a'],['mistakes','आम गलतियाँ','a'],['mins','मिनट','n'],['order','क्रम','n'],['soon','जल्द आ रहा है (Coming soon) — सामग्री तैयार होने पर टिक हटाएँ','b'],['published','प्रकाशित','b']],
 questions:[['chapterId','अध्याय','sel:chapters'],['lessonId','पाठ (वैकल्पिक — पाठ क्विज़ के लिए)','lsel'],['type','प्रकार','sel:mcq,num,multi'],['text','प्रश्न','a'],['o1','विकल्प 1'],['o2','विकल्प 2'],['o3','विकल्प 3'],['o4','विकल्प 4'],['answer','उत्तर (mcq: 1-4 | multi: 1,3 | num: संख्या)'],['tol','सहनशीलता (केवल num)','n'],['marks','अंक','n'],['neg','नेगेटिव अंक','n'],['explanation','व्याख्या/हल','a'],['order','क्रम','n'],['published','प्रकाशित','b']]};
const lsOpts=(cid,sel)=>'<option value="">— कोई नहीं (केवल अध्याय मिक्स) —</option>'+C.lessons.filter(l=>l.chapterId==cid).map(l=>`<option value="${l.id}" ${l.id==sel?'selected':''}>${esc(l.title)}</option>`).join('');
const LBL={subjects:'विषय',chapters:'अध्याय',lessons:'पाठ',questions:'प्रश्न',users:'यूज़र'};

 h+=`<div class="row" style="margin-bottom:8px"><button class="btn s" onclick="A.edit('${k}')">＋ नया</button><button class="btn s w" onclick="A.imp('${k}')">⬆ इम्पोर्ट</button><button class="btn s w" onclick="A.exp('${k}','csv')">⬇ CSV</button><button class="btn s w" onclick="A.exp('${k}','json')">⬇ JSON</button>${C.subjects.length?'':'<button class="btn s b" onclick="A.seed()">सैंपल डेटा लोड करें</button>'}</div>`;
 const pf=k=='chapters'?'subjectId':'chapterId',src=k=='chapters'?C.subjects:C.chapters;

 async doImp(){if(v.busy)return;const col=v.imp;v.pubAll=$('#imppub').checked;let items;
  try{items=parseIn($('#imptxt').value)}catch(e){return toast('फ़ॉर्मेट गलत है: '+e.message)}
  if(!items.length)return toast('कुछ नहीं मिला');
  const find=(arr,k)=>{const a=arr.find(x=>x.id==k||x.title==k);return a&&a.id},errs=[],docs=[];
  items.forEach((it,n)=>{const d={...it},id=d.id;delete d.id;const e=m=>errs.push((n+2)+': '+m);
   if(col=='chapters'){d.subjectId=d.subjectId||find(C.subjects,d.subject);delete d.subject}
   if(col=='lessons'||col=='questions'){d.chapterId=d.chapterId||find(C.chapters,d.chapter);delete d.chapter}
   if(col=='questions'){const k=d.lesson;delete d.lesson;if(!d.lessonId&&k){const l=C.lessons.find(x=>x.chapterId==d.chapterId&&(x.id==k||x.title==k));d.lessonId=l?l.id:'';if(!l)e('पाठ "'+k+'" इस अध्याय में नहीं मिला')}
    if(d.lessonId&&!C.lessons.find(x=>x.id==d.lessonId&&x.chapterId==d.chapterId))e('पाठ और अध्याय मेल नहीं खाते')}
   SC[col].forEach(([k,l,ty])=>{if(ty=='n'&&d[k]!==undefined&&d[k]!=='')d[k]=+d[k];if(ty=='b'&&d[k]!==undefined)d[k]=d[k]===true||['true','1','हाँ','yes'].includes(String(d[k]).toLowerCase())});
   if(v.pubAll)d.published=true;if(d.published===undefined)d.published=false;
   if(!id&&d.order===undefined)d.order=C[col].length+n+1;
   if(!(d.title||d.text))return e('title/text खाली है');
   if(col!='subjects'&&!d[SC[col][0][0]])return e('अध्याय/विषय नहीं मिला (नाम सही लिखें)');
   if(id&&String(id).includes('/'))return e('id में / नहीं चल सकता');
   if(col=='questions'){d.type=d.type||'mcq';d.answer=String(d.answer??'').replace(/\s/g,'');const m=checkQ(d);if(m)return e(m)}
   docs.push([id,d])});
  if(errs.length)return alert('इन पंक्तियों को ठीक करें (कुछ भी सहेजा नहीं गया):\n'+errs.slice(0,15).join('\n'));
  v.busy=true;
  try{for(let i=0;i<docs.length;i+=400){const b=writeBatch(db);docs.slice(i,i+400).forEach(([id,d])=>b.set(id?doc(db,col,String(id)):doc(collection(db,col)),{...d,updated:serverTimestamp()},{merge:true}));await b.commit()}
   await reload();v.imp=null;toast(docs.length+' आइटम सहेजे ✓')}catch(e){toast('त्रुटि: '+(e.code||e.message))}
  v.busy=false;render()},

 async seed(){ // sample content: Arithmetic, 7 chapters, 1 lesson + 1 question each
  const S=[['add','जोड़ (Addition)','➕','दाएँ से बाएँ अंक जोड़ें; योग 9 से अधिक हो तो हासिल (carry) आगे ले जाएँ।','$a+b=b+a$','$478+259$: इकाई 8+9=17 (7 लिखें, 1 हासिल) … = 737','478 + 259 = ?',['727','737','747','637'],'2'],
   ['sub','घटाना (Subtraction)','➖','दाएँ से घटाएँ; छोटा अंक हो तो अगले अंक से उधार (borrow) लें।','$a-b=c \\Rightarrow c+b=a$','$1000-357=643$ (जाँच: 643+357=1000)','1000 − 357 = ?',['653','643','743','633'],'2'],
   ['mul','गुणा (Multiplication)','✖️','गुणा बार-बार जोड़ है। पहाड़े याद रखें।','$a\\times b=b\\times a$','$23\\times17=23\\times10+23\\times7=391$','23 × 17 = ?',['381','391','401','371'],'2'],
   ['div','भाग (Division)','➗','भाज्य = भाजक × भागफल + शेषफल','$\\text{भाज्य}=\\text{भाजक}\\times\\text{भागफल}+\\text{शेष}$','$756\\div12=63$','756 ÷ 12 = ?',['62','63','64','73'],'2'],
   ['frac','भिन्न (Fraction)','🍕','जोड़ने से पहले हर (denominator) बराबर करें।','$\\frac{a}{b}+\\frac{c}{d}=\\frac{ad+bc}{bd}$','$\\frac12+\\frac13=\\frac{3+2}{6}=\\frac56$','$\\frac12+\\frac13=?$',['$\\frac25$','$\\frac56$','$\\frac16$','$\\frac26$'],'2'],
   ['dec','दशमलव (Decimal)','🔢','दशमलव बिंदु को सीध में रखकर जोड़ें/घटाएँ।','$0.5=\\frac{5}{10}$','$12.5+7.25=19.75$','12.5 + 7.25 = ? (संख्या लिखें)',null,'19.75'],
   ['pct','प्रतिशत (Percentage)','💯','प्रतिशत यानी प्रति सैकड़ा।','$x\\%\\text{ of }N=\\frac{x}{100}\\times N$','$20\\%$ of $250=\\frac{20}{100}\\times250=50$','250 का 20% = ?',['40','50','60','25'],'2']];
  try{const b=writeBatch(db),t=serverTimestamp();b.set(doc(db,'subjects','arith'),{title:'अंकगणित (Arithmetic)',emoji:'🧮',order:1,published:true,updated:t});
   S.forEach((s,i)=>{const cid='ch-'+s[0];b.set(doc(db,'chapters',cid),{subjectId:'arith',title:s[1],emoji:s[2],order:i+1,published:true,updated:t});
    b.set(doc(db,'lessons','ls-'+s[0]),{chapterId:cid,title:s[1],intro:'परीक्षा में बार-बार पूछा जाने वाला विषय।',theory:s[3],formulas:s[4],example:s[5],steps:'ऊपर के उदाहरण को चरण-दर-चरण हल करके देखें।',shortcut:'',mistakes:'हासिल/उधार भूलना।',mins:5,order:1,published:true,updated:t});
    b.set(doc(db,'questions','q-'+s[0]),{chapterId:cid,type:s[7]?'mcq':'num',text:s[5+1],o1:(s[7]||[])[0]||'',o2:(s[7]||[])[1]||'',o3:(s[7]||[])[2]||'',o4:(s[7]||[])[3]||'',answer:s[8],tol:0,marks:1,neg:0,explanation:s[5],order:1,published:true,updated:t})});
   await b.commit();await reload();toast('सैंपल डेटा जुड़ गया ✓');render()}catch(e){toast('त्रुटि: '+(e.code||e.message))}}};
